<div class="admin-page">
  <header class="page-header">
    <h1>Gerenciar Usuários</h1>
    <div class="actions">
        <button (click)="exportToCSV()" class="btn-primary">Exportar CSV</button>
        <button (click)="printReport()" class="btn-secondary">Imprimir / PDF</button>
        <a routerLink="/admin/dashboard" class="btn-secondary">Voltar</a>
    </div>
  </header>

  <section class="list-section">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Email</th>
          <th>Data Cadastro</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of users()">
          <td>{{ u.id }}</td>
          <td>{{ u.nome_completo }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.data_cadastro | date:'dd/MM/yyyy HH:mm' }}</td>
        </tr>
        <tr *ngIf="users().length === 0">
            <td colspan="4" class="text-center">Nenhum usuário encontrado.</td>
        </tr>
      </tbody>
    </table>
  </section>
</div>
